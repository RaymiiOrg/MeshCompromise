[platformio]
src_dir = bridge/src
include_dir = bridge/include
test_dir = test

[env:native]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
	-std=c++17
	-Wall
	-Wextra
	-DPB_ENABLE_MALLOC=1
	-DPB_VALIDATE_UTF8=1
	-DMESHTASTIC_EXCLUDE_PKI=1
	-DMESHTASTIC_EXCLUDE_XEDDSA=1
	-DMESHTASTIC_EXCLUDE_PKI_KEYGEN=1
	-DRADIOLIB_GODMODE=1
	-isystem test/support
	-isystem external/radiolib/src
	-isystem external/meshcore/src
	-isystem external/meshcore/lib/ed25519
	-isystem external/crypto
	-isystem external/nanopb
	-isystem external/meshtastic/src/mesh/generated
	-isystem external/meshtastic/src
build_src_filter =
	+<*>
	+<../../external/radiolib/src/>
	+<../../external/meshcore/src/Dispatcher.cpp>
	+<../../external/meshcore/src/Identity.cpp>
	+<../../external/meshcore/src/Mesh.cpp>
	+<../../external/meshcore/src/Packet.cpp>
	+<../../external/meshcore/src/Utils.cpp>
	+<../../external/meshcore/src/helpers/AdvertDataHelpers.cpp>
	+<../../external/meshcore/src/helpers/StaticPoolPacketManager.cpp>
	+<../../external/meshcore/lib/ed25519/>
	+<../../external/meshtastic/src/mesh/CryptoEngine.cpp>
	+<../../external/crypto/AES128.cpp>
	+<../../external/crypto/AES256.cpp>
	+<../../external/crypto/CTR.cpp>
	+<../../external/crypto/AESCommon.cpp>
	+<../../external/crypto/BigNumberUtil.cpp>
	+<../../external/crypto/BlockCipher.cpp>
	+<../../external/crypto/ChaCha.cpp>
	+<../../external/crypto/Cipher.cpp>
	+<../../external/crypto/Crypto.cpp>
	+<../../external/crypto/Curve25519.cpp>
	+<../../external/crypto/Ed25519.cpp>
	+<../../external/crypto/Hash.cpp>
	+<../../external/crypto/NoiseSource.cpp>
	+<../../external/crypto/RNG.cpp>
	+<../../external/crypto/SHA256.cpp>
	+<../../external/crypto/SHA512.cpp>
	+<../../external/nanopb/pb_common.c>
	+<../../external/nanopb/pb_decode.c>
	+<../../external/nanopb/pb_encode.c>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/channel.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/config.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/device_ui.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/mesh.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/module_config.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/portnums.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/telemetry.pb.cpp>
	+<../../external/meshtastic/src/mesh/generated/meshtastic/xmodem.pb.cpp>
build_unflags = -std=gnu++11

[env:coverage]
extends = env:native
build_flags =
	${env:native.build_flags}
	--coverage
	-O0
	-fprofile-abs-path
build_type = debug
extra_scripts = scripts/pio_coverage.py
